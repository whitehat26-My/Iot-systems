# Mosquitto configuration for the room-sensor hub.
#
# ============================================================================
#  WHY THIS FILE EXISTS
# ============================================================================
# A stock Mosquitto install listens on localhost ONLY. Everything works when
# you test on the broker machine itself, and then your ESP32 cannot connect and
# the error it reports is a bare, unhelpful "connect failed".
#
# That is the single most common failure in a Pi-hub-plus-ESP32 build. The two
# lines under "listener" below are the fix, which is why this ships as a real
# file rather than as an instruction to go and edit something.
#
# On the Pi:
#     sudo cp hub/mosquitto/room-sensors.conf /etc/mosquitto/conf.d/
#     sudo systemctl restart mosquitto
#
# On your laptop for step 1, run the broker straight out of the repo:
#     mosquitto -c hub/mosquitto/room-sensors.conf -v
# ============================================================================


# --- Listener ---------------------------------------------------------------
# 1883 is the standard unencrypted MQTT port. Binding 0.0.0.0 means "accept
# connections on every network interface", which is what lets the ESP32 in.
listener 1883 0.0.0.0

# --- Access -----------------------------------------------------------------
# Anonymous access. This is a deliberate choice for a first project on a home
# network you control, and it keeps setup from becoming a certificate tutorial.
#
#   *** This broker must never be reachable from the internet. ***
#
# Do not port-forward 1883 on your router. If you want your readings while you
# are out of the house, put a VPN in front of it (Tailscale or WireGuard) —
# do not open the port. See docs/07-next-steps.md for how to add a username,
# a password, and TLS, which you should do before this leaves your LAN.
allow_anonymous true

# --- Persistence ------------------------------------------------------------
# Deliberately NOT configured here.
#
# On the Pi this file is dropped into /etc/mosquitto/conf.d/, which is merged
# with the packaged /etc/mosquitto/mosquitto.conf — and that already enables
# persistence into /var/lib/mosquitto/, a directory owned by the mosquitto user.
# Setting it again here would be redundant.
#
# On your laptop you run this config directly as your own user, where writing to
# /var/lib/mosquitto/ would be refused. Leaving persistence off means the broker
# starts cleanly in both places from one file, and losing retained messages
# between restarts does not matter while you are testing.

# --- Logging ----------------------------------------------------------------
# On the Pi this goes to the systemd journal:  journalctl -u mosquitto -f
# Add `log_type debug` temporarily if a node will not connect — it logs every
# connection attempt with a reason.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Log when clients connect and disconnect. Very useful early on: it is how you
# confirm the ESP32 actually reached the broker, as opposed to failing silently
# somewhere on your WiFi.
connection_messages true

# --- Limits -----------------------------------------------------------------
# A sensor node publishes a handful of short messages every 30 seconds, so the
# defaults are generous already. This cap just stops a misbehaving client from
# filling the Pi's memory with queued messages.
max_queued_messages 1000

# Reject anything larger than 8KB; our biggest message is a ~150 byte JSON
# snapshot, so nothing legitimate comes close. (Mosquitto 2.x renamed the old
# `message_size_limit` to this.)
max_packet_size 8192
